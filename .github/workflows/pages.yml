name: Publish dashboard to GitHub Pages

# Publishes ONLY Flight_Ops_Planner_Dashboard.html (as index.html) and the briefing/ page (screenshots of demo data, no ATOM screenshot). No Excel files, sources or notes.
on:
  push:
    branches: [main]
    paths: [Flight_Ops_Planner_Dashboard.html, .dashboard_source.html, '*.xlsx', briefing/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The Pages dashboard embeds the repo's xlsx files. Only publish while they are still the demo set.
      - name: Guard - demo data only
        run: |
          pip install openpyxl
          python3 - <<'EOF'
          import sys, openpyxl
          ws = openpyxl.load_workbook("Flight_Ops_Planner_SUP2.xlsx")["Roster"]
          ids = {str(ws.cell(r, 2).value or "").strip().upper() for r in range(6, 60)}
          if "VIPER" not in ids:
              sys.exit("SUP 2 roster no longer holds the demo crew. Refusing to publish a build that may contain real data.")
          EOF

      # The briefing must never carry the ATOM screenshot (real currency dates).
      - name: Guard - no ATOM screenshot in the briefing
        run: |
          test ! -e briefing/assets/atom.webp || { echo "briefing/assets/atom.webp must not be published"; exit 1; }
          ! grep -q "atom.webp" briefing/index.html || { echo "briefing/index.html still points at atom.webp"; exit 1; }

      - name: Stage the dashboard and the briefing only
        run: |
          mkdir _site
          # z159: the dashboard in the repo has no demo files; the Pages copy is built with them so its sample button works
          python3 .lodestar_build.py dashboard --demo --out _site/index.html
          cp -r briefing _site/briefing

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
