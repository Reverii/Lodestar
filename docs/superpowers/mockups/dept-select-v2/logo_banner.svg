<text class="ls-word" x="100" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="5" fill="#f8fafc">LODESTAR</text>
<text class="ls-sub" x="101" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1" fill="#94a3b8">121 SQN · FLIGHT &amp; OPS PLANNER</text></svg>