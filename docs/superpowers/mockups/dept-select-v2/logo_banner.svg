<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="360" height="90" class="lslogo" role="img" aria-label="LODESTAR Flight and Ops Planner"><style>
.ls-tile{animation:ls-tile .5s ease-out both}
.ls-ring{stroke-dasharray:132;stroke-dashoffset:132;animation:ls-ring .7s .1s ease-out forwards}
.ls-rose{transform-box:fill-box;transform-origin:center;animation:ls-rose 1.5s .2s cubic-bezier(.18,.9,.3,1.12) both}
.ls-glow{transform-box:fill-box;transform-origin:center;opacity:0;animation:ls-glow .7s 1.55s ease-out both}
.ls-spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:ls-spark .8s 1.6s ease-out both}
.ls-word{opacity:0;animation:ls-word .9s 1.7s cubic-bezier(.2,.8,.2,1) forwards}
.ls-sub{opacity:0;animation:ls-sub .6s 2.35s ease-out forwards}
@keyframes ls-tile{from{opacity:0}to{opacity:1}}
@keyframes ls-ring{to{stroke-dashoffset:0}}
@keyframes ls-rose{from{transform:rotate(-540deg) scale(.3);opacity:0}25%{opacity:1}to{transform:rotate(0) scale(1);opacity:1}}
@keyframes ls-glow{0%{opacity:0;transform:scale(.6)}35%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes ls-spark{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.2) rotate(45deg)}100%{opacity:0;transform:scale(.2) rotate(90deg)}}
@keyframes ls-word{from{opacity:0;letter-spacing:22px}to{opacity:1;letter-spacing:5px}}
@keyframes ls-sub{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<rect width="400" height="100" fill="#0f172a"/>
