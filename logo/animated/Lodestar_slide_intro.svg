<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.st{opacity:0;animation:stIn 1.6s ease-out forwards,tw 2.4s ease-in-out infinite alternate}
@keyframes stIn{to{opacity:.35}}
@keyframes tw{0%{opacity:.35}100%{opacity:.08}}
.halo{opacity:0;animation:halo 2.5s .2s ease-out forwards}
@keyframes halo{to{opacity:1}}
.ring{stroke-dasharray:132;stroke-dashoffset:132;animation:ring 1.2s .4s ease-in-out forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.rose{transform-box:fill-box;transform-origin:center;animation:rose 2.6s .6s cubic-bezier(.16,.85,.3,1.08) both}
@keyframes rose{from{transform:rotate(-720deg) scale(.2);opacity:0}20%{opacity:1}to{transform:rotate(0) scale(1);opacity:1}}
.glow{transform-box:fill-box;transform-origin:center;opacity:0;animation:glow 1s 3.1s ease-out both}
@keyframes glow{0%{opacity:0;transform:scale(.5)}35%{opacity:.9;transform:scale(1.1)}100%{opacity:0;transform:scale(1.8)}}
.spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:spark 1.1s 3.15s ease-out both}
@keyframes spark{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.3) rotate(45deg)}100%{opacity:0;transform:scale(.2) rotate(90deg)}}
.word{opacity:0;animation:word 1.4s 3.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes word{from{opacity:0;letter-spacing:70px}to{opacity:1;letter-spacing:22px}}
.sub{opacity:0;animation:up .9s 4.6s ease-out forwards}
.tag{opacity:0;animation:up .9s 5.4s ease-out forwards}
.line{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:line .9s 5.2s ease-out forwards}
@keyframes line{to{transform:scaleX(1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
